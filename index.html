<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaiperxPANEL VIP</title>

  <!-- Web App Icon -->
  <link rel="apple-touch-icon" href="https://i.postimg.cc/pXKtV2nr/A9D672B5-B8F4-4DB1-A712-BB7B980B32C1.png">
  <link rel="icon" type="image/png" href="https://i.postimg.cc/pXKtV2nr/A9D672B5-B8F4-4DB1-A712-BB7B980B32C1.png">
  <meta name="apple-mobile-web-app-title" content="VaiperxPANEL">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #030305;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Background Ambient Glow */
    body::before {
      content: '';
      position: fixed;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(255, 0, 60, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
      top: 20%;
      z-index: 0;
      animation: pulseGlow 4s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(1.3); opacity: 0.9; }
    }

    /* VIP Animated Gradient Border Wrapper */
    .vip-wrapper {
      position: relative;
      width: 100%;
      max-width: 380px;
      border-radius: 30px;
      padding: 2px;
      background: linear-gradient(135deg, #ff003c, #1a0006, #ff003c, #000);
      background-size: 300% 300%;
      animation: animatedBorder 6s ease infinite;
      box-shadow: 0 0 35px rgba(255, 0, 60, 0.3);
      z-index: 1;
    }

    @keyframes animatedBorder {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Inner Panel Container */
    .panel-container {
      width: 100%;
      background: rgba(12, 10, 14, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 24px 18px;
      position: relative;
      overflow: hidden;
    }

    /* Header Section */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .title-group {
      display: flex;
      flex-direction: column;
    }

    .title-main {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #ffffff 30%, #aaaaaa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-style: italic;
    }

    .title-sub-badge {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .title-sub {
      font-size: 14px;
      font-weight: 900;
      color: #ff003c;
      letter-spacing: 2.5px;
      font-style: italic;
      text-shadow: 0 0 10px rgba(255, 0, 60, 0.8);
    }

    .vip-tag {
      background: linear-gradient(90deg, #ff003c, #ff5500);
      font-size: 8px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 4px;
      color: #fff;
      letter-spacing: 1px;
      box-shadow: 0 0 8px rgba(255, 0, 60, 0.6);
    }

    .menu-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 8px 10px;
      border-radius: 12px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.2s;
    }

    .menu-btn:active {
      transform: scale(0.92);
    }

    /* Logo Section */
    .logo-container {
      text-align: center;
      margin: 10px 0 22px 0;
      position: relative;
    }

    .logo-img {
      width: 120px;
      height: auto;
      border-radius: 20px;
      filter: drop-shadow(0 0 20px rgba(255, 0, 60, 0.75));
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .logo-text {
      background: linear-gradient(90deg, #ff003c, #ff4d6d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
      letter-spacing: 3px;
      font-size: 15px;
      margin-top: 8px;
      filter: drop-shadow(0 0 8px rgba(255, 0, 60, 0.6));
    }

    /* Section Headers */
    .section-title {
      font-size: 10px;
      font-weight: 800;
      color: #666677;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
    }

    /* Status System Box */
    .status-box {
      background: linear-gradient(180deg, rgba(22, 16, 20, 0.7) 0%, rgba(12, 8, 10, 0.7) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 22px;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .status-item:last-child {
      margin-bottom: 0;
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 700;
      color: #f0f0f5;
    }

    .svg-icon {
      width: 18px;
      height: 18px;
      stroke: #ff003c;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 5px rgba(255, 0, 60, 0.8));
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .value-text {
      font-size: 11px;
      font-weight: 900;
      color: #ff3355;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
    }

    .value-text.active {
      color: #00ff88;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.8);
    }

    /* Custom Switch VIP */
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #1a1a24;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 2px;
      bottom: 2px;
      background: linear-gradient(180deg, #ffffff, #cccccc);
      transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    input:checked + .slider {
      background: linear-gradient(90deg, #00b862, #00ff88);
      border-color: #00ff88;
      box-shadow: 0 0 12px rgba(0, 255, 136, 0.6);
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    /* Features Grid VIP */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 22px;
    }

    .feature-card {
      background: linear-gradient(180deg, rgba(25, 18, 22, 0.6) 0%, rgba(12, 8, 10, 0.8) 100%);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 14px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    .svg-icon-large {
      width: 26px;
      height: 26px;
      stroke: #ff003c;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px rgba(255, 0, 60, 0.6));
      transition: all 0.3s ease;
      z-index: 2;
    }

    .feature-card span {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #cccccc;
      text-align: center;
      transition: all 0.3s ease;
      z-index: 2;
    }

    /* 🔥 Active Online VIP State + เอฟเฟกต์ออร่าวิ่งรอบไอคอน */
    .feature-card.online {
      border-color: transparent;
      background: linear-gradient(180deg, rgba(0, 35, 18, 0.85) 0%, rgba(5, 18, 10, 0.95) 100%);
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.3), inset 0 0 12px rgba(0, 255, 136, 0.2);
      transform: translateY(-2px);
    }

    /* เส้นลำแสงหมุนวิ่งวนรอบไอคอน */
    .feature-card.online::before {
      content: '';
      position: absolute;
      width: 150%;
      height: 150%;
      background: conic-gradient(transparent, transparent, transparent, #00ff88);
      animation: rotateAura 2s linear infinite;
      z-index: 0;
    }

    .feature-card.online::after {
      content: 'ONLINE';
      position: absolute;
      top: 4px;
      right: 6px;
      font-size: 7px;
      font-weight: 900;
      color: #00ff88;
      letter-spacing: 0.5px;
      z-index: 2;
    }

    /* หน้ากากกรอบด้านในเพื่อตัดขอบเส้นแสง */
    .feature-card-inner-mask {
      position: absolute;
      inset: 1px;
      background: linear-gradient(180deg, rgba(3, 20, 10, 0.95) 0%, rgba(2, 10, 5, 0.98) 100%);
      border-radius: 15px;
      z-index: 1;
      display: none;
    }

    .feature-card.online .feature-card-inner-mask {
      display: block;
    }

    @keyframes rotateAura {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .feature-card.online .svg-icon-large {
      stroke: #00ff88;
      filter: drop-shadow(0 0 12px rgba(0, 255, 136, 0.9));
      animation: iconPulse 1.5s infinite alternate;
    }

    @keyframes iconPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    .feature-card.online span {
      color: #00ff88;
      text-shadow: 0 0 8px rgba(0, 255, 136, 0.8);
    }

    /* Button Group Container */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Tutorial Video Button */
    .tutorial-btn {
      width: 100%;
      background: linear-gradient(180deg, rgba(40, 28, 10, 0.8) 0%, rgba(20, 12, 4, 0.9) 100%);
      border: 1px solid #ffaa00;
      border-radius: 16px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #ffbb00;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 170, 0, 0.2);
      transition: all 0.2s ease;
    }

    .tutorial-btn:active {
      transform: scale(0.97);
    }

    /* VIP Action Button */
    .action-btn {
      width: 100%;
      background: linear-gradient(180deg, #ff003c 0%, #990024 100%);
      border: none;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 0, 60, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.4);
      transition: all 0.2s ease;
    }

    .action-btn:active {
      transform: scale(0.97);
      box-shadow: 0 0 15px rgba(255, 0, 60, 0.8);
    }

    /* ==========================================
       POPUP OVERLAY VIP STYLES
       ========================================== */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 20px;
      animation: fadeIn 0.3s ease-out forwards;
    }

    .popup-card {
      width: 100%;
      max-width: 320px;
      background: linear-gradient(180deg, #180a0d 0%, #080304 100%);
      border: 1px solid rgba(255, 0, 60, 0.5);
      border-radius: 24px;
      padding: 22px 18px;
      text-align: center;
      box-shadow: 0 0 50px rgba(255, 0, 60, 0.35);
      animation: scaleUp 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .popup-img-container {
      width: 100%;
      height: 180px;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 18px;
      border: 1px solid rgba(255, 0, 60, 0.3);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.8);
    }

    .popup-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .popup-title {
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 18px;
      letter-spacing: 0.5px;
    }

    .popup-buttons {
      display: flex;
      gap: 10px;
    }

    .popup-btn {
      flex: 1;
      padding: 12px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .popup-btn-no {
      background: rgba(255, 0, 60, 0.15);
      border: 1px solid #ff003c;
      color: #ff4d6d;
    }

    .popup-btn-no:active {
      transform: scale(0.95);
    }

    .popup-btn-yes {
      background: linear-gradient(180deg, #00ff88 0%, #00b862 100%);
      border: none;
      color: #000000;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
    }

    .popup-btn-yes:active {
      transform: scale(0.95);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleUp {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

      <div class="button-group">
        <button class="tutorial-btn" onclick="openTutorial()">
          <svg class="svg-icon" viewBox="0 0 24 24" style="width:18px; height:18px; stroke:#ffbb00;">
            <polygon points="23 7 16 12 23 17 23 7"/>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
          </svg>
          ดูคลิปสอนใช้งาน
        </button>

        <button class="action-btn" onclick="runScript()">
          <svg class="svg-icon" viewBox="0 0 24 24" style="width:20px; height:20px; stroke:#ffffff;">
            <polygon points="5 3 19 12 5 21 5 3" fill="#ffffff"/>
          </svg>
          EXECUTE SCRIPT
        </button>
      </div>

    </div>
  </div>

  <script>
    function closePopup() {
      document.getElementById('popupOverlay').style.display = 'none';
    }

    function goToTutorialLink() {
      window.open('https://drive.google.com/file/d/1tVQRxBsDQqicCBmzXrFtmLEqjhzTju3G/view?usp=drivesdk', '_blank');
    }

    function toggleFeature(currentCheckbox, statusId, cardId) {
      const checkboxes = document.querySelectorAll('.feature-toggle');
      const isChecked = currentCheckbox.checked;

      checkboxes.forEach(cb => {
        cb.checked = false;
      });

      document.querySelectorAll('.value-text').forEach(el => {
        el.textContent = 'OFFLINE';
        el.classList.remove('active');
      });

      document.querySelectorAll('.feature-card').forEach(card => {
        card.classList.remove('online');
      });

      if (isChecked) {
        currentCheckbox.checked = true;
        
        const targetStatus = document.getElementById(statusId);
        targetStatus.textContent = 'ONLINE';
        targetStatus.classList.add('active');

        const targetCard = document.getElementById(cardId);
        if (targetCard) {
          targetCard.classList.add('online');
        }
      }
    }

    function openTutorial() {
      window.open('https://drive.google.com/file/d/1hTwyCv9JmFAK7q6RGlC1VGUFRbxQI8ry/view?usp=drivesdk', '_blank');
    }

    function runScript() {
      window.open('https://viper-x.mrpcs.online', '_self');
    }
  </script>

</body>
</html>
