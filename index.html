<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaiperxPANEL</title>

  <!-- กำหนดไอคอนเมื่อเพิ่มลงหน้าจอหลัก (iOS / Android Web App Icon) -->
  <link rel="apple-touch-icon" href="https://i.postimg.cc/pXKtV2nr/A9D672B5-B8F4-4DB1-A712-BB7B980B32C1.png">
  <link rel="icon" type="image/png" href="https://i.postimg.cc/pXKtV2nr/A9D672B5-B8F4-4DB1-A712-BB7B980B32C1.png">
  <meta name="apple-mobile-web-app-title" content="VaiperxPANEL">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Outer Glow Container */
    .panel-container {
      width: 100%;
      max-width: 380px;
      background: rgba(15, 8, 12, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 22px 18px;
      border: 1px solid rgba(255, 42, 42, 0.25);
      box-shadow: 0 0 35px rgba(255, 0, 0, 0.15), inset 0 0 15px rgba(255, 0, 0, 0.05);
      position: relative;
      overflow: hidden;
    }

    /* Neon Top Aura Line */
    .panel-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 15%;
      width: 70%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ff2a2a, transparent);
      box-shadow: 0 0 12px #ff2a2a;
    }

    /* Header Section */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .title-group {
      display: flex;
      flex-direction: column;
    }

    .title-main {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #ffffff;
      font-style: italic;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .title-sub {
      font-size: 15px;
      font-weight: 800;
      color: #ff2a2a;
      letter-spacing: 2px;
      margin-top: -4px;
      font-style: italic;
      text-shadow: 0 0 8px rgba(255, 42, 42, 0.6);
    }

    .menu-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 8px;
      border-radius: 10px;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    /* Logo Section */
    .logo-container {
      text-align: center;
      margin: 5px 0 20px 0;
    }

    .logo-img {
      width: 125px;
      height: auto;
      filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.6));
    }

    .logo-text {
      color: #ff3b3b;
      font-weight: 900;
      letter-spacing: 3px;
      font-size: 16px;
      margin-top: 6px;
      text-shadow: 0 0 12px rgba(255, 59, 59, 0.8);
    }

    /* Section Headers */
    .section-title {
      font-size: 11px;
      font-weight: 800;
      color: #777777;
      letter-spacing: 1px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    /* Status System Box */
    .status-box {
      background: rgba(20, 10, 12, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 22px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .status-item:last-child {
      margin-bottom: 0;
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 600;
      color: #eeeeee;
    }

    .svg-icon {
      width: 18px;
      height: 18px;
      stroke: #ff3b3b;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 4px rgba(255, 59, 59, 0.8));
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .value-text {
      font-size: 12px;
      font-weight: 800;
      color: #ff3b3b;
      transition: all 0.3s ease;
      text-shadow: 0 0 6px rgba(255, 59, 59, 0.5);
    }

    .value-text.active {
      color: #2ecc71;
      text-shadow: 0 0 8px rgba(46, 204, 113, 0.8);
    }

    /* Custom Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 22px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #222222;
      border: 1px solid rgba(255,255,255,0.08);
      transition: .3s;
      border-radius: 22px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background-color: #ffffff;
      transition: .3s;
      border-radius: 50%;
      box-shadow: 0 0 5px rgba(0,0,0,0.5);
    }

    input:checked + .slider {
      background: linear-gradient(90deg, #10b981, #059669);
      border-color: #10b981;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.8);
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    /* Features Grid */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 22px;
    }

    .feature-card {
      background: rgba(20, 10, 12, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 14px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      transition: all 0.3s ease;
    }

    .svg-icon-large {
      width: 28px;
      height: 28px;
      stroke: #ff3b3b;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px rgba(255, 59, 59, 0.6));
      transition: all 0.3s ease;
    }

    .feature-card span {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #e0e0e0;
      text-align: center;
      transition: all 0.3s ease;
    }

    /* Active Online State สำหรับไอคอน 4 ตัวล่าง */
    .feature-card.online {
      border-color: rgba(46, 204, 113, 0.5);
      background: rgba(10, 30, 20, 0.7);
      box-shadow: 0 0 15px rgba(46, 204, 113, 0.25), inset 0 0 10px rgba(46, 204, 113, 0.15);
    }

    .feature-card.online .svg-icon-large {
      stroke: #2ecc71;
      filter: drop-shadow(0 0 10px rgba(46, 204, 113, 0.9));
    }

    .feature-card.online span {
      color: #2ecc71;
      text-shadow: 0 0 6px rgba(46, 204, 113, 0.6);
    }

    .feature-card.online::after {
      content: 'ONLINE';
      position: absolute;
      top: 4px;
      right: 6px;
      font-size: 7px;
      font-weight: 900;
      color: #2ecc71;
      letter-spacing: 0.5px;
    }

    /* Action Button */
    .action-btn {
      width: 100%;
      background: linear-gradient(180deg, rgba(30, 10, 12, 0.9) 0%, rgba(15, 5, 5, 0.9) 100%);
      border: 1px solid #ff2a2a;
      border-radius: 14px;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #ff3b3b;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: inset 0 0 15px rgba(255, 42, 42, 0.2), 0 0 15px rgba(255, 42, 42, 0.3);
      transition: all 0.3s ease;
    }

    .action-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="panel-container">
    <!-- Header -->
    <div class="header">
      <div class="title-group">
        <span class="title-main">VAIPERX</span>
        <span class="title-sub">PANEL</span>
      </div>
      <button class="menu-btn">
        <svg class="svg-icon" style="stroke:#fff; width:16px; height:16px;" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
    </div>

    <!-- Logo -->
    <div class="logo-container">
      <img src="https://i.postimg.cc/9QJ7fVdc/33522088-88D6-45F9-9EB5-E91C0D8C0978.png" alt="Logo" class="logo-img">
      <div class="logo-text">VIP PANEL</div>
    </div>

    <!-- Status System Section -->
    <div class="section-title">STATUS SYSTEM</div>
    <div class="status-box">
      
      <!-- Item 1: ยิงตัวโดนหัว -->
      <div class="status-item">
        <div class="item-left">
          <svg class="svg-icon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v4M12 19v4M1 12h4M19 12h4"/>
          </svg>
          <span>ยิงตัวโดนหัว</span>
        </div>
        <div class="item-right">
          <span class="value-text" id="status-1">ปิด</span>
          <label class="switch">
            <input type="checkbox" class="feature-toggle" onclick="toggleFeature(this, 'status-1', 'card-1')">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <!-- Item 2: ขยายดาเมจหัว -->
      <div class="status-item">
        <div class="item-left">
          <svg class="svg-icon" viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4"/>
            <path d="M12 14v6M9 17h6"/>
          </svg>
          <span>ขยายดาเมจหัว</span>
        </div>
        <div class="item-right">
          <span class="value-text" id="status-2">ปิด</span>
          <label class="switch">
            <input type="checkbox" class="feature-toggle" onclick="toggleFeature(this, 'status-2', 'card-2')">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <!-- Item 3: ขยายดาเมจตัว -->
      <div class="status-item">
        <div class="item-left">
          <svg class="svg-icon" viewBox="0 0 24 24">
            <path d="M12 2a5 5 0 0 0-5 5v3a5 5 0 0 0 10 0V7a5 5 0 0 0-5-2z"/>
            <path d="M6 14a6 6 0 0 0 12 0"/>
          </svg>
          <span>ขยายดาเมจตัว</span>
        </div>
        <div class="item-right">
          <span class="value-text" id="status-3">ปิด</span>
          <label class="switch">
            <input type="checkbox" class="feature-toggle" onclick="toggleFeature(this, 'status-3', 'card-3')">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <!-- Item 4: ล็อคคอ -->
      <div class="status-item">
        <div class="item-left">
          <svg class="svg-icon" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <span>ล็อคคอ</span>
        </div>
        <div class="item-right">
          <span class="value-text" id="status-4">ปิด</span>
          <label class="switch">
            <input type="checkbox" class="feature-toggle" onclick="toggleFeature(this, 'status-4', 'card-4')">
            <span class="slider"></span>
          </label>
        </div>
      </div>

    </div>

    <!-- Features Section -->
    <div class="section-title">FEATURES</div>
    <div class="features-grid">
      
      <!-- Card 1: ยิงตัวโดนหัว -->
      <div class="feature-card" id="card-1">
        <svg class="svg-icon-large" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="7"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
        </svg>
        <span>ยิงตัวโดนหัว</span>
      </div>

      <!-- Card 2: ดาเมจหัว -->
      <div class="feature-card" id="card-2">
        <svg class="svg-icon-large" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="5"/>
          <path d="M7 20h10M12 13v7"/>
        </svg>
        <span>ดาเมจหัว</span>
      </div>

      <!-- Card 3: ดาเมจตัว -->
      <div class="feature-card" id="card-3">
        <svg class="svg-icon-large" viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>ดาเมจตัว</span>
      </div>

      <!-- Card 4: ล็อคคอ -->
      <div class="feature-card" id="card-4">
        <svg class="svg-icon-large" viewBox="0 0 24 24">
          <path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span>ล็อคคอ</span>
      </div>

      <!-- Card 5: ESP LINE -->
      <div class="feature-card">
        <svg class="svg-icon-large" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8"/>
          <line x1="12" y1="4" x2="12" y2="20"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
        </svg>
        <span>ESP LINE</span>
      </div>

      <!-- Card 6: NO RECOIL -->
      <div class="feature-card">
        <svg class="svg-icon-large" viewBox="0 0 24 24">
          <path d="M2 12h14"/>
          <path d="M13 7l5 5-5 5"/>
        </svg>
        <span>NO RECOIL</span>
      </div>

    </div>

    <!-- Bottom Action Button -->
    <button class="action-btn" onclick="runScript()">
      <svg class="svg-icon" viewBox="0 0 24 24" style="width:20px; height:20px; stroke:#ff3b3b;">
        <polygon points="5 3 19 12 5 21 5 3" fill="#ff3b3b"/>
      </svg>
      รันสคริป
    </button>
  </div>

  <script>
    function toggleFeature(currentCheckbox, statusId, cardId) {
      const checkboxes = document.querySelectorAll('.feature-toggle');
      const isChecked = currentCheckbox.checked;

      checkboxes.forEach(cb => {
        cb.checked = false;
      });

      document.querySelectorAll('.value-text').forEach(el => {
        el.textContent = 'ปิด';
        el.classList.remove('active');
      });

      document.querySelectorAll('.feature-card').forEach(card => {
        card.classList.remove('online');
      });

      if (isChecked) {
        currentCheckbox.checked = true;
        
        const targetStatus = document.getElementById(statusId);
        targetStatus.textContent = 'เปิด';
        targetStatus.classList.add('active');

        const targetCard = document.getElementById(cardId);
        if (targetCard) {
          targetCard.classList.add('online');
        }
      }
    }

    function runScript() {
      window.open('https://viper-x.mrpcs.online', '_self');
    }
  </script>

</body>
</html>
